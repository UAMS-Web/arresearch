name: CI

# Calls the shared job chain in UAMS-Web/uams-ci-workflows and adds the one job a ruleset
# requires, `CI`. The chain (Composer validate, synced files, no-emoji, aggregate-needs, Pint,
# Rector, PHPStan, Pest, floor lint, download archive) lives there, from the template
# `.claude/skills/code-quality/templates/ci-reusable.yml` in UAMS-Web/uams-claude-skills.
#
# - `uses:` names a release tag of UAMS-Web/uams-ci-workflows, never a branch, so a change to
#   the shared chain reaches this repository only when the tag here moves.
# - This is a theme: every job runs on `ubuntu-latest` alone (`linux-only`), and the floor lint
#   parses the shipped PHP files under PHP 8.2, the supported floor.
# - Mutation testing is on. `mutate-paths` names the first-party PHP: a pull request or a push
#   mutates only the files under it that the change touches (none touched passes with the reason
#   printed), and a manual run mutates all of it through the `mutate` Composer script.
# - The called jobs check out this repository, so it carries `.github/actions/setup/action.yml`,
#   the synced `.claude/skills` scripts, the Composer scripts `test:pint`, `test:refactor`,
#   `stan` and `test`, and `tests/skip-baseline.json`.
# - `CI` needs the call, runs `if: always()`, and fails unless the call reports `success`. Do not
#   rename `CI`, and do not rename the `checks` job without changing `needs:` below.
# - The repository is public, so no `RUN_REMOTE_CI` gate is set: the chain runs on every pull
#   request. A private repository adds `if: vars.RUN_REMOTE_CI == 'true'` to `checks`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:
  # The weekly full mutation pass, Mondays at 07:17 UTC. A pull request and a push mutate only the files
  # they change; this run mutates everything `composer mutate` covers, under the chain's default 180-minute
  # full-run timeout, so decay no pull request touches is caught. A schedule runs on the default branch,
  # and GitHub disables it after 60 days without repository activity.
  schedule:
    - cron: '17 7 * * 1'

# A new push to a pull request cancels that pull request's stale run, so a pull request keeps
# one group. Every other run (a push to the default branch, a manual run) gets a group of its
# own, keyed on the commit, so a later push never cancels it. A shared push group would: GitHub
# keeps one running and one pending run per group and cancels the pending one when another is
# queued, whatever `cancel-in-progress` says, so a merge landing during a long run would cancel
# the previous merge's run before it started a job. Its commit would show a short, settled run
# and the chain would never have run on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.11.0
    with:
      linux-only: true
      mutate-paths: functions.php lib archive-portfolio.php front-page.php page_landing.php single-portfolio.php
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      floor-lint-command: >-
        find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './.claude/*'
        -not -path './.agents/*' -not -path './.cursor/*' -print0 | xargs -0 -n1 php -l

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call;
  # scripts/check-templates.mjs in UAMS-Web/uams-claude-skills checks it.
  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
